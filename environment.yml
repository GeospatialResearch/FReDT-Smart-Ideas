# YML file for setting up the Digital-Twin Python environment
# Locked down most package versions to reduce docker build to,e

name: fredt_003
channels:
  - conda-forge
  - nodefaults
dependencies:
  - aiohttp==3.13.3
  - botocore==1.42.70
  - celery==5.5.3
  - conda-pack==0.9.1
  - flask==3.1.3
  - flask-cors==6.0.2
  - flask-swagger-ui==5.21.0
  - gdal
  - geoalchemy2==0.18.4
  - geoapis==0.3.2
  - geocube
  - geopandas>=1.0
  - gevent==25.9.1
  - hydromt_wflow==1.1.0
  - libgdal
  - lxml
  - netCDF4
  - pandas==2.3.3
  - pip==26.0.1
  - psycopg2
  - pyarrow
  - pytest==9.0.2
  - python=3.11
  - python-dotenv==1.2.2
  - python-pdal
  - rasterio>=1.4
  - rasterstats
  - redis-py==7.3.0
  - rioxarray
  - scrapy==2.11.1
  - twisted==22.10.0
  - whitebox==2.3.6
  - whitebox_tools==2.4.0
  - sqlalchemy==2.0.48
  - xarray
  - pip:
      - geovoronoi==0.4.0
      - gunicorn==25.1.0
      - git+https://github.com/LukeParky/NewZeaLiDAR.git@update_sqlalchemy
      - git+https://github.com/GeospatialResearch/OWSLib.git
      - pywps==4.7.0 # pywps is available in conda but our fork of OWSLib is required for bounding boxes
      - whitebox-workflows==1.3.4

